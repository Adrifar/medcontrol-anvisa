        }

            { nome: "C5 - Anabolizantes", cor: "#81ECEC", classe: "cat-c5" },
            { nome: "Antimicrobianos", cor: "#9B59B6", classe: "cat-antib" },
            { nome: "Agonistas GLP-1", cor: "#1ABC9C", classe: "cat-glp" }
        ];

        // Renderizar lista de categorias
        function renderCategoryList() {
            categoryList.innerHTML = '';
            categorias.forEach(cat => {
                const count = medicamentos.filter(m => m.categoria === cat.nome).length;
                const item = document.createElement('div');
                item.className = 'category-item';
                item.style.background = cat.cor + '20';
                item.innerHTML = `
                    <div class="category-info">
                        <div class="category-dot" style="background: ${cat.cor}"></div>
                        <span class="category-name" style="color: #333">${cat.nome}</span>
                    </div>
                    <span class="category-count" style="background: ${cat.cor}40; color: #333">${count}</span>
                `;
                item.addEventListener('click', () => showMedList(cat.nome));
                categoryList.appendChild(item);
            });
        }

        // Mostrar lista de medicamentos da categoria
        function showMedList(categoria) {
            const meds = medicamentos.filter(m => m.categoria === categoria);
            modalTitle.textContent = categoria;
            modalList.innerHTML = '';
            
            if (meds.length === 0) {
                modalList.innerHTML = '<div class="no-results">Nenhum medicamento encontrado</div>';
            } else {
                meds.forEach(med => {
                    const item = document.createElement('div');
                    item.className = 'modal-med-item';
                    item.innerHTML = `<strong>${med.principioAtivo}</strong>`;
                    item.addEventListener('click', () => {
                        selectMedication(med);
                        medListModal.classList.remove('active');
                    });
                    modalList.appendChild(item);
                });
            }
            
            medListModal.classList.add('active');
        }

        // Fechar modal
        modalClose.addEventListener('click', () => {
            medListModal.classList.remove('active');
        });

        medListModal.addEventListener('click', (e) => {
            if (e.target === medListModal) {
                medListModal.classList.remove('active');
            }
        });

        // Busca e autocomplete
        searchInput.addEventListener('input', (e) => {
            const value = e.target.value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            
            if (value.length < 2) {
                dropdown.classList.remove('active');
                return;
            }
            
            const filtered = medicamentos.filter(m => 
                m.principioAtivo.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').includes(value)
            ).slice(0, 10);
            
            dropdown.innerHTML = '';
            
            if (filtered.length === 0) {
                dropdown.innerHTML = '<div class="dropdown-item"><span class="med-name">Nenhum medicamento encontrado</span></div>';
            } else {
                filtered.forEach(med => {
                    const item = document.createElement('div');
                    item.className = 'dropdown-item';
                    item.innerHTML = `
                        <div class="med-name">${med.principioAtivo}</div>
                        <div class="med-cat">${med.categoria}</div>
                    `;
                    item.addEventListener('click', () => selectMedication(med));
                    dropdown.appendChild(item);
                });
            }
            
            dropdown.classList.add('active');
        });

        // Selecionar medicamento
        function selectMedication(med) {
            searchInput.value = med.principioAtivo;
            dropdown.classList.remove('active');
            
            // Preencher resultado
            categoryBadge.textContent = med.categoria.split(' - ')[0];
            categoryBadge.style.background = med.cor;
            categoryBadge.className = 'category-badge ' + getCategoryClass(med.categoria);
            
            resultTitle.textContent = med.principioAtivo;
            infoClasse.textContent = med.classe;
            if (med.notificacao) {
                document.getElementById('infoNotificacao').textContent = med.notificacao;
                document.getElementById('notificacaoItem').style.display = 'block';
            } else {
                document.getElementById('notificacaoItem').style.display = 'none';
            }
            infoReceita.textContent = med.receita;
            infoValidade.textContent = med.validade;
            infoDuracao.textContent = med.duracao;
            infoRetencao.textContent = med.retencao;
            
            resultCard.classList.add('active');
        }

        function getCategoryClass(categoria) {
            if (categoria.includes('A1')) return 'cat-a1';
            if (categoria.includes('A2')) return 'cat-a2';
            if (categoria.includes('A3')) return 'cat-a3';
            if (categoria.includes('B1')) return 'cat-b1';
            if (categoria.includes('B2')) return 'cat-b2';
            if (categoria.includes('C1')) return 'cat-c1';
            if (categoria.includes('C2')) return 'cat-c2';
            if (categoria.includes('C3')) return 'cat-c3';
            if (categoria.includes('C4')) return 'cat-c4';
            if (categoria.includes('C5')) return 'cat-c5';
            if (categoria.includes('Antimicrobianos')) return 'cat-antib';
            if (categoria.includes('Agonistas GLP-1')) return 'cat-glp';
            return '';
        }

        // Fechar dropdown ao clicar fora
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                dropdown.classList.remove('active');
            }
        });

        // PWA Install
        let deferredPrompt;
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.add('visible');
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.classList.remove('visible');
                }
                deferredPrompt = null;
            }
        });

        // Offline detection
        window.addEventListener('online', () => {
            offlineIndicator.classList.remove('active');
        });

        window.addEventListener('offline', () => {
            offlineIndicator.classList.add('active');
        });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => {
                console.log('Service Worker registration failed:', err);
            });
        }

        // Inicializar
        renderCategoryList();
    </script>
</body>
</html>
